server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.tomcat.max-http-form-post-size=8KB
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
server.tomcat.connection-timeout=20s
server.tomcat.threads.max=50

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/transport_tickets}
spring.datasource.username=${MYSQL_USER:tickets}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
